name: Selective Sync From Fork

on:
  # Normal pushes to v2:
  # only src/** changes will cause UPM publishing/tagging.
  push:
    branches:
      - v2

  # Manual run:
  # explicitly synchronizes the latest master -> v2.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without committing, pushing, or tagging'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

jobs:
  # ============================================================
  # SYNC + PUBLISH
  # ============================================================

  sync:
    runs-on: ubuntu-latest

    outputs:
      upm_published: ${{ steps.publish_upm.outputs.published }}
      should_tag: ${{ steps.tag_check.outputs.should_tag }}

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Configure Git and fetch latest branches
      # ----------------------------------------------------------

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Fetching latest master and v2..."

          git fetch origin \
            master \
            v2 \
            --tags

          # upm may not exist on the first run.
          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            upm >/dev/null 2>&1; then

            echo "Existing upm branch found."
            git fetch origin upm

          else
            echo "upm branch does not exist yet."
            echo "It will be created if publishing is required."
          fi

      # ----------------------------------------------------------
      # Determine workflow mode
      #
      # MANUAL RUN:
      #   Always sync latest master -> v2.
      #
      # PUSH TO v2:
      #   Only publish when src/** changed.
      # ----------------------------------------------------------

      - name: Determine workflow operation
        id: mode
        shell: bash
        run: |
          SYNC_MASTER=false
          SRC_CHANGED=false
          UPM_EXISTS=false

          echo "Event:  ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"

          # --------------------------------------------------------
          # Check whether UPM currently exists.
          # --------------------------------------------------------

          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            upm >/dev/null 2>&1; then

            UPM_EXISTS=true
          fi

          # --------------------------------------------------------
          # MANUAL RUN
          #
          # A manual run explicitly means:
          #
          # latest master
          #      ↓
          # sync into v2/src
          #      ↓
          # publish upm if necessary
          #      ↓
          # tag package
          # --------------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Manual run detected."
            echo "Latest master will be synchronized into v2."

            SYNC_MASTER=true

          # --------------------------------------------------------
          # NORMAL PUSH TO v2
          # --------------------------------------------------------

          elif [ "${{ github.ref_name }}" = "v2" ]; then

            # If UPM doesn't exist yet, force initial publication.
            if [ "$UPM_EXISTS" = "false" ]; then

              echo "upm branch does not exist."
              echo "Initial package publication will be performed."

              SRC_CHANGED=true

            else

              BEFORE="${{ github.event.before }}"
              AFTER="${{ github.sha }}"

              echo "Checking v2 src changes:"
              echo "  Before: $BEFORE"
              echo "  After:  $AFTER"

              if ! git diff --quiet \
                "$BEFORE" \
                "$AFTER" \
                -- 'src/**'; then

                SRC_CHANGED=true
                echo "Changes detected under src/**"

              else

                echo "No changes detected under src/**"

              fi

            fi

          fi

          echo "sync_master=$SYNC_MASTER" >> "$GITHUB_OUTPUT"
          echo "src_changed=$SRC_CHANGED" >> "$GITHUB_OUTPUT"
          echo "upm_exists=$UPM_EXISTS" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Determine upstream version
      #
      # Used only when explicitly synchronizing master.
      #
      # Supports:
      #
      # v2.1.3 -> 2.1.3
      #
      # fallback:
      #
      # v2 -> 2.0.0
      # ----------------------------------------------------------

      - name: Determine upstream version
        id: version
        if: steps.mode.outputs.sync_master == 'true'
        shell: bash
        run: |
          MESSAGE=$(git log -1 origin/master --pretty=%B)

          echo "Latest master commit:"
          echo "$MESSAGE"

          if [[ "$MESSAGE" =~ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then

            VERSION="${BASH_REMATCH[1]}"

          elif [[ "$MESSAGE" =~ v([0-9]+) ]]; then

            MAJOR="${BASH_REMATCH[1]}"
            VERSION="${MAJOR}.0.0"

          else

            echo "ERROR: Failed to extract version from master commit."
            exit 1

          fi

          echo "Upstream version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Sync latest master -> v2
      #
      # This step NOW runs during workflow_dispatch.
      #
      # v2/
      # ├── README.md
      # ├── URLs.md
      # └── src/
      #     ├── package.json
      #     ├── Fonts/
      #     └── ...
      # ----------------------------------------------------------

      - name: Sync upstream changes into v2
        id: sync_v2
        if: steps.mode.outputs.sync_master == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Checking out latest v2..."

          git checkout -B v2 origin/v2

          # --------------------------------------------------------
          # Validate package source.
          # --------------------------------------------------------

          if [ ! -d "src" ]; then
            echo "ERROR: v2/src does not exist."
            exit 1
          fi

          if [ -z "$(find src -mindepth 1 -print -quit)" ]; then
            echo "ERROR: v2/src is empty."
            exit 1
          fi

          if [ ! -f "src/package.json" ]; then
            echo "ERROR: src/package.json does not exist."
            exit 1
          fi

          # --------------------------------------------------------
          # Update URLs.md from latest master.
          # --------------------------------------------------------

          echo "Synchronizing URLs.md..."

          git checkout origin/master -- URLs.md

          # --------------------------------------------------------
          # Synchronize Fonts from latest master.
          #
          # Upstream:
          #
          # master:
          # src/UnityMaterialSymbols/
          #   Assets/MaterialSymbols/Fonts
          #
          # Destination:
          #
          # v2:
          # src/Fonts
          # --------------------------------------------------------

          echo "Synchronizing Fonts..."

          TEMP_FONTS="$RUNNER_TEMP/upstream-fonts"

          rm -rf "$TEMP_FONTS"
          mkdir -p "$TEMP_FONTS"

          git archive \
            origin/master \
            src/UnityMaterialSymbols/Assets/MaterialSymbols/Fonts \
            | tar -x -C "$TEMP_FONTS"

          mkdir -p src/Fonts

          rsync -a --delete \
            "$TEMP_FONTS/src/UnityMaterialSymbols/Assets/MaterialSymbols/Fonts/" \
            "src/Fonts/"

          # --------------------------------------------------------
          # Update package.json version.
          # --------------------------------------------------------

          echo "Updating package version to $VERSION..."

          jq \
            --arg version "$VERSION" \
            '.version = $version' \
            src/package.json \
            > "$RUNNER_TEMP/package.json"

          mv \
            "$RUNNER_TEMP/package.json" \
            src/package.json

          # --------------------------------------------------------
          # Stage synchronized content.
          # --------------------------------------------------------

          git add \
            URLs.md \
            src/

          # --------------------------------------------------------
          # Detect whether package source actually changed.
          # --------------------------------------------------------

          if git diff --cached --quiet -- src/; then

            SRC_CHANGED=false
            echo "No package changes detected under v2/src."

          else

            SRC_CHANGED=true
            echo "Package changes detected under v2/src."

          fi

          echo "src_changed=$SRC_CHANGED" >> "$GITHUB_OUTPUT"

          # --------------------------------------------------------
          # Show changes.
          # --------------------------------------------------------

          echo
          echo "Synchronized changes:"
          git status --short

          # --------------------------------------------------------
          # Dry run.
          # --------------------------------------------------------

          if [ "$DRY_RUN" = "true" ]; then

            echo
            echo "DRY RUN: v2 changes would be:"
            git diff --cached

            exit 0

          fi

          # --------------------------------------------------------
          # Commit and push v2.
          #
          # This includes URL-only changes as well.
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            echo "v2 is already synchronized."
            echo "No v2 commit required."

          else

            git commit \
              -m "Sync upstream changes"

            git push origin v2

            echo "v2 updated successfully."

          fi

      # ----------------------------------------------------------
      # Determine whether UPM needs publishing.
      #
      # First publication:
      #   Always publish if upm doesn't exist.
      #
      # Manual master sync:
      #   Publish if v2/src changed.
      #
      # v2 push:
      #   Publish if src/** changed.
      # ----------------------------------------------------------

      - name: Determine whether UPM should be published
        id: publish
        shell: bash
        run: |
          SHOULD_PUBLISH=false

          # --------------------------------------------------------
          # UPM doesn't exist yet:
          # always create it.
          # --------------------------------------------------------

          if [ "${{ steps.mode.outputs.upm_exists }}" = "false" ]; then

            SHOULD_PUBLISH=true

          # --------------------------------------------------------
          # Manual master sync.
          # --------------------------------------------------------

          elif [ "${{ steps.mode.outputs.sync_master }}" = "true" ]; then

            if [ "${{ steps.sync_v2.outputs.src_changed }}" = "true" ]; then
              SHOULD_PUBLISH=true
            fi

          # --------------------------------------------------------
          # Normal v2 push.
          # --------------------------------------------------------

          elif [ "${{ steps.mode.outputs.src_changed }}" = "true" ]; then

            SHOULD_PUBLISH=true

          fi

          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

          echo "Publish UPM: $SHOULD_PUBLISH"

      # ----------------------------------------------------------
      # Prepare latest v2/src package
      # ----------------------------------------------------------

      - name: Prepare package content
        if: steps.publish.outputs.should_publish == 'true'
        shell: bash
        run: |
          # --------------------------------------------------------
          # During a normal v2 push, ensure latest remote v2.
          #
          # During manual master sync, we're already on the updated
          # v2 working tree/commit.
          # --------------------------------------------------------

          if [ "${{ steps.mode.outputs.sync_master }}" != "true" ]; then

            git fetch origin v2
            git checkout -B v2 origin/v2

          fi

          # --------------------------------------------------------
          # Validate source.
          # --------------------------------------------------------

          if [ ! -d "src" ]; then
            echo "ERROR: v2/src does not exist."
            exit 1
          fi

          if [ -z "$(find src -mindepth 1 -print -quit)" ]; then
            echo "ERROR: v2/src is empty."
            exit 1
          fi

          if [ ! -f "src/package.json" ]; then
            echo "ERROR: src/package.json does not exist."
            exit 1
          fi

          # --------------------------------------------------------
          # Copy package into temporary storage before switching
          # branches.
          # --------------------------------------------------------

          PACKAGE_TEMP="$RUNNER_TEMP/upm-package"

          rm -rf "$PACKAGE_TEMP"
          mkdir -p "$PACKAGE_TEMP"

          cp -a \
            src/. \
            "$PACKAGE_TEMP/"

          echo "Package contents prepared:"
          find "$PACKAGE_TEMP" -maxdepth 4 -print

      # ----------------------------------------------------------
      # Publish v2/src -> upm root
      # ----------------------------------------------------------

      - name: Publish src to upm
        id: publish_upm
        if: steps.publish.outputs.should_publish == 'true'
        shell: bash
        run: |
          echo "published=false" >> "$GITHUB_OUTPUT"

          PACKAGE_TEMP="$RUNNER_TEMP/upm-package"

          # --------------------------------------------------------
          # Existing UPM branch.
          # --------------------------------------------------------

          if git show-ref \
            --verify \
            --quiet \
            refs/remotes/origin/upm; then

            echo "Using existing upm branch."

            git checkout -B \
              upm \
              origin/upm

          # --------------------------------------------------------
          # First publication.
          # --------------------------------------------------------

          else

            echo "upm branch does not exist."
            echo "Creating orphan upm branch."

            git checkout --orphan upm
            git rm -rf . || true

          fi

          # --------------------------------------------------------
          # Make upm an exact mirror of v2/src.
          # --------------------------------------------------------

          git rm -rf . || true

          git clean \
            -fdx \
            -e .git

          cp -a \
            "$PACKAGE_TEMP"/. \
            .

          git add --all

          # --------------------------------------------------------
          # Already synchronized.
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            echo "UPM package is already up to date."
            exit 0

          fi

          # --------------------------------------------------------
          # Dry run.
          # --------------------------------------------------------

          if [ "$DRY_RUN" = "true" ]; then

            echo
            echo "DRY RUN: UPM changes would be:"
            git status --short

            echo
            git diff --cached

            exit 0

          fi

          # --------------------------------------------------------
          # Publish.
          # --------------------------------------------------------

          VERSION=$(jq -r '.version' package.json)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: package.json version not found."
            exit 1
          fi

          git commit \
            -m "Publish package v$VERSION"

          git push \
            origin \
            upm

          echo "published=true" >> "$GITHUB_OUTPUT"

          echo "UPM package published successfully."

      # ----------------------------------------------------------
      # Decide whether tagging should run.
      #
      # Unlike the old version, tagging does NOT depend solely on
      # whether a brand-new UPM commit was required.
      #
      # This means a missing tag can still be created when UPM
      # already happens to be synchronized.
      # ----------------------------------------------------------

      - name: Determine whether package should be tagged
        id: tag_check
        if: always()
        shell: bash
        run: |
          SHOULD_TAG=false

          if [ "$DRY_RUN" != "true" ]; then

            # Manual sync:
            # always check package.json/tag afterwards.
            if [ "${{ steps.mode.outputs.sync_master }}" = "true" ]; then

              SHOULD_TAG=true

            # Direct v2 src update.
            elif [ "${{ steps.mode.outputs.src_changed }}" = "true" ]; then

              SHOULD_TAG=true

            fi

          fi

          echo "should_tag=$SHOULD_TAG" >> "$GITHUB_OUTPUT"

          echo "Tag repository: $SHOULD_TAG"

  # ============================================================
  # TAG PACKAGE
  #
  # Runs after synchronization/publishing completes.
  #
  # Reads:
  #
  # v2/src/package.json
  #
  # The reusable workflow should skip automatically when that
  # version tag already exists.
  # ============================================================

  tag-package:
    needs: sync

    if: |
      needs.sync.result == 'success' &&
      needs.sync.outputs.should_tag == 'true'

    uses: ebukaracer/gh-workflows/.github/workflows/tag-package.yml@main

    with:
      target_branch: 'v2'
      package_json: 'src/package.json'
      tag_prefix: 'v'
      dry_run: false
